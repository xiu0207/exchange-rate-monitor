name: 汇率监控定时任务

on:
  schedule:
    # 每天 UTC 时间 2:00 运行，北京时间是 10:00
    - cron: '0 2 * * *'
  workflow_dispatch:  # 允许你在网页上手动点击按钮触发

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行脚本
        run: python exchange_rate_monitor.py

      - name: 上传图表为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: exchange-rate-chart
          path: exchange_rates.png
          retention-days: 30
